  #   backoffLimit: 6
  #   parallelism: 1
  #   completions: 1
  #   completionMode: NonIndexed  # NonIndexed or Indexed
  #   activeDeadlineSeconds: 600
  #   ttlSecondsAfterFinished: 300
  #   restartPolicy: Never        # Never or OnFailure
  #
  #   # --- CronJob-specific (set schedule to enable CronJob) ---
  #   schedule: ""               # e.g. "0 * * * *" for hourly
  #   suspend: false
  #   concurrencyPolicy: Allow   # Allow, Forbid, or Replace
  #   startingDeadlineSeconds: ""
  #   successfulJobsHistoryLimit: 1
  #   failedJobsHistoryLimit: 3
  #
  #   # --- Pod config ---
  #   resources: {}
  #   nodeSelector: {}
