# Default values for KubeKit.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
command: []
  # Optional command to override the default container entrypoint
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: 
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  # capabilities:
  #   drop:
  #   - ALL

services:
  type: ClusterIP
  service:
  - name: http
    port: 80
    protocol: TCP
  #   serviceName: ""
  # - name: https
  #   port: 443
  #   protocol: TCP
  #   serviceName: great

configmap:
  enabled: false
  configs: {}
    # key: value

secretRefs:
  enabled: false
  secrets: []
    # - secret
    # - another-secret

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

livenessProbe:
  enabled: false
  endpoint: /
  port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 2
  failureThreshold: 2

readinessProbe:
  enabled: false
  endpoint: /
  port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 2
  failureThreshold: 2

persistence:
  enabled: false
  volumes: []
    # - name: data
    #   accessMode: ReadWriteOnce
    #   size: 10Gi
    #   storageClass: ""
    #   mountPath: /data
    #   annotations: {}
    # - name: logs
    #   accessMode: ReadWriteOnce
    #   size: 5Gi
    #   storageClass: ""
    #   mountPath: /logs
    #   annotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Jobs & CronJobs
# Each entry renders as a Job (no schedule) or CronJob (schedule set).
# Jobs fully reuse chart features: configmap, secretRefs, persistence, serviceAccount.
jobs: []
  # - name: db-migrate
  #   enabled: true
  #
  #   # --- Resource-level metadata ---
  #   annotations: {}           # Annotations on the Job/CronJob resource
  #   labels: {}                # Extra labels merged into Job/CronJob metadata
  #
  #   # --- Pod-level metadata ---
  #   podAnnotations: {}        # Annotations on the pod template
  #   podLabels: {}             # Extra labels merged into pod template
  #
  #   # --- Image ---
  #   image:
  #     repository: myapp
  #     tag: ""                 # Defaults to chart appVersion
  #     pullPolicy: IfNotPresent
  #
  #   # --- Container ---
  #   command: []
  #   args: []
