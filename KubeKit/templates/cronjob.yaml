{{- range .Values.jobs }}
{{- $jobName := .name }}
{{- if and .schedule (ne (len .name) 0) }}
{{- if ne (toString .enabled) "false" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "KubeKit.fullname" $ }}-{{ .name }}
  labels:
    {{- include "KubeKit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .schedule | quote }}
  {{- with .suspend }}
  suspend: {{ . }}
  {{- end }}
  {{- with .concurrencyPolicy }}
  concurrencyPolicy: {{ . }}
  {{- end }}
  {{- with .startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .successfulJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ . }}
  {{- end }}
  {{- with .failedJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ . }}
  {{- end }}
  jobTemplate:
    metadata:
      labels:
        {{- include "KubeKit.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ .name }}
        {{- with .labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .backoffLimit }}
      backoffLimit: {{ . }}
      {{- end }}
      {{- with .parallelism }}
      parallelism: {{ . }}
      {{- end }}
      {{- with .completions }}
      completions: {{ . }}
      {{- end }}
      {{- with .completionMode }}
      completionMode: {{ . }}
      {{- end }}
      {{- with .activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      {{- with .ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      template:
        metadata:
          {{- with .podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "KubeKit.labels" $ | nindent 12 }}
            app.kubernetes.io/component: {{ .name }}
            {{- with .podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          {{- with .imagePullSecrets | default $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ .serviceAccountName | default (include "KubeKit.serviceAccountName" $) }}
          {{- with .podSecurityContext | default $.Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: {{ .restartPolicy | default "Never" }}
          containers:
            - name: {{ .name }}
              {{- with .securityContext | default $.Values.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- $image := .image | default $.Values.image }}
              image: "{{ $image.repository }}:{{ $image.tag | default $.Chart.AppVersion }}"
              imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
              {{- with .command }}
              command:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                {{- with .env }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              envFrom:
              {{- $envFrom := .envFrom | default dict }}
              {{- if or $envFrom.configmap (and (not $envFrom) $.Values.configmap.enabled) }}
                - configMapRef:
                    name: {{ include "KubeKit.fullname" $ }}-cm
              {{- end }}
              {{- $secrets := $envFrom.secretRefs | default (ternary $.Values.secretRefs.secrets nil (and (kindIs "map" $.Values.secretRefs) $.Values.secretRefs.enabled)) }}
              {{- range $secrets }}
                - secretRef:
                    name: {{ . }}
              {{- end }}
              {{- with .resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- $persistence := .persistence | default dict }}
              {{- if $persistence.enabled }}
              volumeMounts:
              {{- range $persistence.volumes }}
                - name: {{ $jobName }}-{{ .name }}-storage
                  mountPath: {{ .mountPath }}
              {{- end }}
              {{- end }}
          {{- $persistence := .persistence | default dict }}
          {{- if $persistence.enabled }}
          volumes:
          {{- range $persistence.volumes }}
            - name: {{ $jobName }}-{{ .name }}-storage
              persistentVolumeClaim:
                claimName: {{ include "KubeKit.fullname" $ }}-{{ $jobName }}-{{ .name }}-pvc
          {{- end }}
          {{- end }}
          {{- with .nodeSelector | default $.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .affinity | default $.Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .tolerations | default $.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
